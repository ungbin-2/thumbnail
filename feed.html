<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>익명속닥 인스타 피드 썸네일 생성기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeon+Sung&family=Gugi&family=Nanum+Myeongjo:wght@400;700;800&family=Song+Myung&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Pretendard';
    font-weight: 700;
    font-style: normal;
    font-display: block;
    src: url('https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2-subset/Pretendard-Bold.subset.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2-subset/Pretendard-Bold.subset.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Pretendard';
    font-weight: 400;
    font-style: normal;
    font-display: block;
    src: url('https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2-subset/Pretendard-Regular.subset.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2-subset/Pretendard-Regular.subset.woff2') format('woff2');
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: #1a1a1a;
    color: #fff;
    min-height: 100vh;
    padding: 16px;
    padding-bottom: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  h1 { font-size: 17px; font-weight: 700; margin-top: 6px; letter-spacing: -0.3px; }

  .tabs {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 500px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 11px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.3px;
    text-decoration: none;
    cursor: pointer;
    background: #2a2a2a;
    color: #999;
    border: 1px solid #3a3a3a;
  }
  .tab.active { background: #fff; color: #000; border-color: #fff; }

  .controls { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 10px; }

  label { font-size: 12px; color: #999; margin-bottom: 4px; display: block; letter-spacing: -0.2px; }

  textarea, input[type="text"] {
    width: 100%;
    padding: 14px;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
    font-family: inherit;
    resize: vertical;
    letter-spacing: -0.3px;
  }
  textarea { min-height: 96px; line-height: 1.4; }
  textarea:focus, input:focus { outline: none; border-color: #888; }

  button {
    padding: 14px;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: -0.3px;
  }
  button:active { transform: scale(0.98); }
  button.secondary { background: #2a2a2a; color: #fff; border: 1px solid #444; }

  .preview-wrap {
    width: 100%;
    max-width: 300px;
    aspect-ratio: 4 / 5;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  #canvas { width: 100%; height: 100%; display: block; }

  .hint { font-size: 12px; color: #777; text-align: center; line-height: 1.6; max-width: 320px; letter-spacing: -0.2px; }

  .chip-row { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    padding: 8px 13px;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 20px;
    color: #ccc;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: -0.2px;
  }
  .chip:active { background: #333; }

  .swatch-row { display: flex; gap: 9px; flex-wrap: wrap; }
  .swatch {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid #444;
    transition: transform .08s;
  }
  .swatch.active { border-color: #fff; transform: scale(1.12); }

  .toggle-advanced {
    background: transparent;
    color: #888;
    border: none;
    font-size: 13px;
    padding: 6px;
    cursor: pointer;
    text-decoration: underline;
    font-family: inherit;
  }
  .advanced { display: none; flex-direction: column; gap: 12px; padding: 12px; background: #222; border-radius: 10px; border: 1px solid #333; }
  .advanced.open { display: flex; }
  .size-control { display: flex; align-items: center; gap: 10px; }
  .size-control label { margin: 0; white-space: nowrap; min-width: 64px; }
  input[type="range"] { flex: 1; accent-color: #fff; }
  .size-value { min-width: 46px; text-align: right; font-size: 13px; color: #fff; }
</style>
</head>
<body>

<h1>익명속닥 인스타 피드 썸네일 생성기</h1>

<div class="tabs">
  <a class="tab" href="index.html">릴스용</a>
  <span class="tab active">피드용</span>
</div>

<div class="controls">
  <div>
    <label>후킹 문장 (한 줄이 핵심 / 엔터로 줄바꿈)</label>
    <textarea id="title" placeholder="예) 남편이 출장을&#10;나만 빼고 갔는데"></textarea>
  </div>

  <div>
    <label>카테고리 태그 (선택 — 비우면 안 들어감)</label>
    <input type="text" id="tag" placeholder="예) 막장썰" maxlength="10">
    <div class="chip-row" style="margin-top:8px;">
      <span class="chip" data-tag="썰">썰</span>
      <span class="chip" data-tag="막장썰">막장썰</span>
      <span class="chip" data-tag="가족썰">가족썰</span>
      <span class="chip" data-tag="사이다썰">사이다썰</span>
      <span class="chip" data-tag="회사썰">회사썰</span>
      <span class="chip" data-tag="">지우기</span>
    </div>
  </div>

  <div>
    <label>배경색 (밝은색 계열)</label>
    <div class="swatch-row" id="swatches"></div>
  </div>

  <button onclick="download()">📥 이미지 저장 (1080×1350)</button>
  <button class="secondary" onclick="copyImg()">📋 클립보드 복사</button>

  <button class="toggle-advanced" onclick="toggleAdvanced()">⚙️ 세부 조정 (자동 권장)</button>

  <div class="advanced" id="advanced">
    <div class="size-control">
      <label>글자 크기</label>
      <input type="range" id="fontSize" min="44" max="140" step="1" value="96">
      <span class="size-value" id="fontSizeValue">자동</span>
    </div>
    <div class="size-control">
      <label>세로 위치</label>
      <input type="range" id="verticalPos" min="26" max="52" value="43">
      <span class="size-value" id="verticalPosValue">43%</span>
    </div>
    <button class="secondary" onclick="resetSize()">글자 크기 자동으로</button>
  </div>
</div>

<div class="preview-wrap">
  <canvas id="canvas" width="1080" height="1350"></canvas>
</div>

<p class="hint">
  아이폰: "이미지 저장" → 사진앱 자동 저장<br>
  Safari에서 열고 홈화면에 추가하면 앱처럼 쓸 수 있음
</p>

  const logoImg = new Image();
  let logoLoaded = false;
  logoImg.onload = () => { logoLoaded = true; render(); };
  logoImg.src = LOGO_SRC;

  // 밝은색 팔레트 (배경 / 글자색)
  // 종이톤 팔레트 — 약간 빛바랜 책 페이지 느낌
  const palette = [
    { bg: "#F4ECD8", fg: "#2a2418" }, // 빈티지 크림
    { bg: "#F3E298", fg: "#2e2710" }, // 옅은 레몬지
    { bg: "#D6E6C8", fg: "#1c2a18" }, // 옅은 민트지
    { bg: "#F0D3B7", fg: "#3a2316" }, // 피치 한지
    { bg: "#D2DEEA", fg: "#192738" }, // 페일 블루지
    { bg: "#DCD2EA", fg: "#241a3a" }, // 옅은 라벤더지
    { bg: "#E8E1D0", fg: "#2a2418" }, // 크림 그레이
  ];
  let current = palette[0];
  let userChangedSize = false;

  // 스와치 렌더
  const swWrap = document.getElementById('swatches');
  palette.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'swatch' + (i === 0 ? ' active' : '');
    d.style.background = p.bg;
    d.onclick = () => {
      current = p;
      [...swWrap.children].forEach(c => c.classList.remove('active'));
      d.classList.add('active');
      render();
    };
    swWrap.appendChild(d);
  });

  // 칩 → 태그 입력
  document.querySelectorAll('.chip').forEach(c => {
    c.onclick = () => { tagEl.value = c.dataset.tag; render(); };
  });

  function toggleAdvanced() { document.getElementById('advanced').classList.toggle('open'); }
  function resetSize() { userChangedSize = false; fontSizeValue.textContent = '자동'; render(); }

  function setLS() { try { ctx.letterSpacing = LS + 'px'; } catch (e) {} }

  // 종이 질감 — 한 번만 생성해서 캐시. 미세 노이즈 + 작은 얼룩 + 약한 비네팅.
  let paperTexture = null;
  function buildPaperTexture() {
    const t = document.createElement('canvas');
    t.width = W; t.height = H;
    const tc = t.getContext('2d');

    // 1) 미세 노이즈 (밝은/어두운 픽셀 점)
    const img = tc.createImageData(W, H);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random();
      // 약간 황톳빛 도는 노이즈 — 갈색 톤
      const r = v < 0.5 ? 60 : 200;
      const g = v < 0.5 ? 45 : 195;
      const b = v < 0.5 ? 25 : 180;
      img.data[i]     = r;
      img.data[i + 1] = g;
      img.data[i + 2] = b;
      img.data[i + 3] = Math.random() * 18; // 매우 옅은 알파
    }
    tc.putImageData(img, 0, 0);

    // 2) 큰 얼룩 / 종이 결 — 옅은 갈색 원
    for (let i = 0; i < 70; i++) {
      const a = 0.015 + Math.random() * 0.035;
      tc.fillStyle = `rgba(95,70,40,${a})`;
      const rad = 2 + Math.random() * 7;
      tc.beginPath();
      tc.arc(Math.random() * W, Math.random() * H, rad, 0, Math.PI * 2);
      tc.fill();
    }

    // 3) 가로 섬유 결 — 아주 옅은 선
    for (let i = 0; i < 55; i++) {
      tc.strokeStyle = `rgba(110,85,50,${0.02 + Math.random() * 0.035})`;
      tc.lineWidth = 0.4 + Math.random() * 0.8;
      tc.beginPath();
      const y = Math.random() * H;
      const x1 = Math.random() * W * 0.4;
      const x2 = W - Math.random() * W * 0.4;
      tc.moveTo(x1, y);
      tc.bezierCurveTo(x1 + 60, y + (Math.random() - 0.5) * 4,
                       x2 - 60, y + (Math.random() - 0.5) * 4,
                       x2, y);
      tc.stroke();
    }

    // 4) 가장자리 비네팅 — 책 페이지처럼 가장자리가 살짝 어둑
    const grad = tc.createRadialGradient(W/2, H/2, W*0.35, W/2, H/2, W*0.72);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(80,55,25,0.10)');
    tc.fillStyle = grad;
    tc.fillRect(0, 0, W, H);

    return t;
  }

  // 줄바꿈: 강제(\n) 우선, 그다음 폭 기준 자동 줄바꿈(띄어쓰기→없으면 글자 단위)
  function wrapLines(text, fontPx) {
    ctx.font = `400 ${fontPx}px ${HEAD_FONT}`;
    setLS();
    const maxW = W - PAD * 2;
    const out = [];
    text.split('\n').forEach(seg => {
      if (seg.trim() === '') { out.push(''); return; }
      const pushCharWrap = (str) => {
        let cur = '';
        for (const ch of str) {
          const t = cur + ch;
          if (ctx.measureText(t).width <= maxW) cur = t;
          else { if (cur) out.push(cur); cur = ch; }
        }
        if (cur) out.push(cur);
      };
      if (seg.includes(' ')) {
        const words = seg.split(' ');
        let line = '';
        for (const w of words) {
          const test = line ? line + ' ' + w : w;
          if (ctx.measureText(test).width <= maxW) { line = test; }
          else {
            if (line) { out.push(line); line = ''; }
            if (ctx.measureText(w).width > maxW) { pushCharWrap(w); }
            else line = w;
          }
        }
        if (line) out.push(line);
      } else {
        pushCharWrap(seg);
      }
    });
    return out;
  }

  function autoFit(text) {
    const maxBlock = H * 0.50;
    for (let f = MAXF; f >= MINF; f -= 1) {
      const lines = wrapLines(text, f);
      const lh = f * 1.26;
      if (lines.length * lh <= maxBlock) return f;
    }
    return MINF;
  }

  function drawCover(img, x, y, w, h) {
    const ir = img.naturalWidth / img.naturalHeight, r = w / h;
    let sw, sh, sx, sy;
    if (ir > r) { sh = img.naturalHeight; sw = sh * r; sx = (img.naturalWidth - sw) / 2; sy = 0; }
    else { sw = img.naturalWidth; sh = sw / r; sx = 0; sy = (img.naturalHeight - sh) / 2; }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  function drawLogo() {
    const d = 168;
    const rightPad = 70;
    const bottomPad = 70;
    const handleSize = 30;
    const gap = 14;

    const cx = W - rightPad - d / 2;
    const cy = H - bottomPad - handleSize - gap - d / 2;

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, d / 2, 0, Math.PI * 2); ctx.closePath();
    ctx.fillStyle = "#ffffff"; ctx.fill();
    ctx.clip();
    if (logoLoaded) drawCover(logoImg, cx - d / 2, cy - d / 2, d, d);
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cy, d / 2, 0, Math.PI * 2);
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,0.16)"; ctx.stroke();

    ctx.letterSpacing = '0px';
    ctx.fillStyle = "rgba(20,15,5,0.65)";
    ctx.font = `700 ${handleSize}px Pretendard, sans-serif`;
    ctx.textAlign = "right"; ctx.textBaseline = "top";
    ctx.fillText(CHANNEL, W - rightPad, cy + d / 2 + gap);
  }

  function render() {
    const title = titleEl.value;
    const tag = tagEl.value.trim();

    // 배경 — 종이 베이스컬러 + 질감 오버레이
    ctx.fillStyle = current.bg;
    ctx.fillRect(0, 0, W, H);
    if (paperTexture) ctx.drawImage(paperTexture, 0, 0);

    if (!title.trim()) { drawLogo(); return; }

    // 글자 크기
    let f;
    if (userChangedSize) f = parseInt(fontSizeEl.value, 10);
    else { f = autoFit(title); fontSizeEl.value = f; }

    const lines = wrapLines(title, f);
    const lh = f * 1.26;
    const centerY = H * (parseInt(verticalPosEl.value, 10) / 100);
    const startY = centerY - ((lines.length - 1) / 2) * lh;
    const blockTop = centerY - (lines.length * lh) / 2;

    // 카테고리 태그(필) — 손글씨로
    if (tag) {
      ctx.font = `400 56px ${HEAD_FONT}`;
      ctx.letterSpacing = '0px';
      const tw = ctx.measureText(tag).width;
      const padX = 34, padY = 14, ph = 56 + padY * 2;
      const pw = tw + padX * 2;
      let py = blockTop - 56 - ph;
      if (py < 96) py = 96;
      const px = (W - pw) / 2;
      const r = ph / 2;
      ctx.fillStyle = INK_COLOR;
      ctx.beginPath();
      ctx.moveTo(px + r, py);
      ctx.arcTo(px + pw, py, px + pw, py + ph, r);
      ctx.arcTo(px + pw, py + ph, px, py + ph, r);
      ctx.arcTo(px, py + ph, px, py, r);
      ctx.arcTo(px, py, px + pw, py, r);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = current.bg;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(tag, W / 2, py + ph / 2 + 4);
    }

    // 헤드라인 — 만년필 잉크
    ctx.font = `400 ${f}px ${HEAD_FONT}`;
    setLS();
    ctx.fillStyle = INK_COLOR;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    lines.forEach((ln, i) => ctx.fillText(ln, W / 2, startY + i * lh));

    drawLogo();
  }

  // 이벤트
  titleEl.addEventListener('input', render);
  tagEl.addEventListener('input', render);
  fontSizeEl.addEventListener('input', () => {
    userChangedSize = true;
    fontSizeValue.textContent = fontSizeEl.value + 'px';
    render();
  });
  verticalPosEl.addEventListener('input', () => {
    verticalPosValue.textContent = verticalPosEl.value + '%';
    render();
  });

  function tsName() {
    const t = (titleEl.value.replace(/\n/g, ' ').trim().slice(0, 14)) || '피드썸네일';
    return t + '.png';
  }
  function download() {
    canvas.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = tsName();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  }
  async function copyImg() {
    canvas.toBlob(async b => {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]);
        alert('클립보드에 복사됐어요!');
      } catch (e) {
        alert('이 브라우저는 복사가 안 돼요. "이미지 저장"을 써주세요.');
      }
    }, 'image/png');
  }

  // 종이 질감 미리 생성 + 폰트가 늦게 로드돼도 자동 재렌더
  paperTexture = buildPaperTexture();

  async function waitForHandwriting() {
    // 한글 글리프 로드 확인 (Yeon Sung). 폴백도 있으니 너무 오래 안 기다림.
    for (let i = 0; i < 40; i++) {
      try {
        await document.fonts.load("100px 'Yeon Sung'", "글");
      } catch (e) {}
      if (document.fonts.check("100px 'Yeon Sung'", "글")) return true;
      await new Promise(r => setTimeout(r, 100));
    }
    return false;
  }

  (async () => {
    render(); // 폰트 늦더라도 일단 한 번 그림 (fallback로라도 보이게)
    await waitForHandwriting();
    render(); // 손글씨 로드 후 다시 그림
  })();

  // 폰트 모두 settle되면 한 번 더 안전망
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => render());
  }
</script>
</body>
</html>
